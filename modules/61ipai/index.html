<script>
  (() => {
    const P = "modulex-iletisim-adim-form";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

        const f = s.querySelector("form[data-fb-form]");
        if (!f) return;
        const A = [...f.querySelectorAll("[data-adim]")];
        if (A.length < 2) return;
        s.classList.add(P + "--ajs");
        const I = [...s.querySelectorAll("[data-adim-isaret]")];
        const geri = f.querySelector('[data-adim-git="-1"]');
        const ileri = f.querySelector('[data-adim-git="1"]');
        const gonder = f.querySelector("[type=submit]");
        const sec = f.querySelector("select[name=topic]");
        const oz = f.querySelector("[data-adim-ozet]");
        let n = 0;
        const ozet = () => {
          if (!oz) return;
          const dl = oz.querySelector("dl");
          if (!dl) return;
          dl.replaceChildren();
          ["topic", "name", "email", "phone"].forEach((ad) => {
            const e = f.elements.namedItem(ad);
            if (!e || !("value" in e)) return;
            const v = e.tagName === "SELECT" ? (e.selectedIndex > 0 ? e.options[e.selectedIndex].text.trim() : "") : String(e.value).trim();
            if (!v) return;
            const l = e.id ? f.querySelector(`label[for="${e.id}"]`) : null;
            const dt = document.createElement("dt");
            dt.textContent = l ? l.textContent.trim() : ad;
            const dd = document.createElement("dd");
            dd.textContent = v;
            dd.dir = "auto";
            dl.append(dt, dd);
          });
          oz.hidden = !dl.children.length;
        };
        const kur = (odak) => {
          A.forEach((a, i) => { a.hidden = i !== n; });
          I.forEach((x, i) => { x.classList.toggle(P + "--tamam", i < n); x.classList.toggle(P + "--simdi", i === n); });
          f.style.setProperty("--oran", String(n / (A.length - 1)));
